<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="SynchroBoard"/>
<title>SynchroBoard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;background:#0d1117;color:#e8e0d0;font-family:Georgia,serif;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:none;}
button{font-family:Georgia,serif;-webkit-tap-highlight-color:transparent;}
#app{height:100vh;display:flex;flex-direction:column;}
#hdr{background:#161b22;border-bottom:1px solid #30363d;padding:6px 10px;display:flex;align-items:center;gap:5px;flex-shrink:0;}
#logo{font-size:13px;font-weight:700;letter-spacing:2px;white-space:nowrap;color:#e8e0d0;margin-right:4px;}
#logo b{color:#e63946;}
#projname{font-size:11px;color:#888;max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.hbtn{padding:4px 7px;background:#21262d;border:1px solid #30363d;border-radius:4px;color:#e8e0d0;cursor:pointer;font-size:10px;flex-shrink:0;}
.hico{background:none;border:none;color:#aaa;cursor:pointer;font-size:13px;padding:2px 4px;flex-shrink:0;}
.hsp{flex:1;}
#mid{display:flex;flex:1;overflow:hidden;min-height:0;}
#sb{width:56px;min-width:56px;background:#161b22;border-right:1px solid #30363d;display:flex;flex-direction:column;align-items:center;padding:5px 0;gap:2px;flex-shrink:0;overflow-y:auto;}
.tbtn{width:42px;height:42px;display:flex;align-items:center;justify-content:center;background:transparent;border:none;border-radius:8px;cursor:pointer;font-size:17px;color:#e8e0d0;-webkit-tap-highlight-color:transparent;}
.tbtn.on{background:#e63946;}
.sep{width:36px;height:1px;background:#30363d;margin:3px 0;flex-shrink:0;}
.cbtn{width:22px;height:22px;border-radius:50%;cursor:pointer;flex-shrink:0;border:2px solid #30363d;-webkit-tap-highlight-color:transparent;}
.cbtn.on{border:3px solid gold;}
.swbtn{width:38px;height:16px;display:flex;align-items:center;justify-content:center;background:transparent;border:none;border-radius:3px;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.slbl{font-size:8px;color:#555;text-align:center;}
#cw{flex:1;position:relative;overflow:hidden;min-width:0;isolation:isolate;}
#cvs{width:100%;height:100%;display:block;touch-action:none;-webkit-tap-highlight-color:transparent;position:absolute;top:0;left:0;}
#pgbar{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:4px;background:rgba(22,27,34,0.93);border:1px solid #30363d;border-radius:20px;padding:5px 10px;z-index:10;max-width:calc(100% - 20px);flex-wrap:wrap;justify-content:center;}
.pgbtn{padding:4px 10px;border:none;border-radius:14px;cursor:pointer;font-size:11px;color:#e8e0d0;background:transparent;-webkit-tap-highlight-color:transparent;white-space:nowrap;}
.pgbtn.on{background:#e63946;}
#pgadd{width:24px;height:24px;border:1px dashed #555;border-radius:50%;background:transparent;color:#888;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0;-webkit-tap-highlight-color:transparent;}
#rp{width:170px;min-width:170px;background:#161b22;border-left:1px solid #30363d;padding:8px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;flex-shrink:0;}
.plbl{font-size:10px;color:#666;letter-spacing:1px;text-transform:uppercase;}
.row{display:flex;align-items:center;justify-content:space-between;}
.cnt{display:flex;align-items:center;gap:3px;}
.cntb{width:20px;height:20px;background:#21262d;border:none;border-radius:4px;color:#e8e0d0;cursor:pointer;font-size:13px;-webkit-tap-highlight-color:transparent;}
.cntv{font-size:13px;font-weight:700;width:22px;text-align:center;}
.sm{font-size:11px;color:#aaa;}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px;}
.fbtn{padding:6px 2px;background:#21262d;border:1px solid #30363d;border-radius:6px;color:#e8e0d0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;-webkit-tap-highlight-color:transparent;}
.fi{font-size:13px;}
.fn{font-size:9px;color:#aaa;}
.psep{width:100%;height:1px;background:#30363d;}
.zbtn{padding:5px;background:#21262d;border:1px solid #30363d;border-radius:4px;color:#e8e0d0;cursor:pointer;font-size:11px;width:100%;margin-bottom:3px;-webkit-tap-highlight-color:transparent;}
.dbtn{padding:5px;background:transparent;border:1px solid #444;border-radius:4px;color:#888;cursor:pointer;font-size:11px;width:100%;margin-bottom:3px;-webkit-tap-highlight-color:transparent;}
.gbtn{padding:6px;background:#1a3a1a;border:1px solid #4CAF50;border-radius:4px;color:#90EE90;cursor:pointer;font-size:11px;width:100%;margin-bottom:3px;font-weight:bold;-webkit-tap-highlight-color:transparent;}
.tip{padding:5px;background:#0d1117;border-radius:5px;font-size:9px;color:#555;line-height:1.7;}
.chkrow{display:flex;align-items:center;gap:6px;}
.chkrow label{font-size:11px;color:#aaa;cursor:pointer;}
#ov{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:999;}
#dlg{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:8px;min-width:240px;max-width:88vw;max-height:80vh;overflow-y:auto;}
.dok{padding:5px 14px;background:#e63946;border:none;border-radius:4px;color:white;cursor:pointer;font-size:13px;}
.dgn{padding:5px 14px;background:#1a3a1a;border:1px solid #4CAF50;border-radius:4px;color:#90EE90;cursor:pointer;font-size:13px;}
.dno{padding:5px 14px;background:transparent;border:1px solid #444;border-radius:4px;color:#aaa;cursor:pointer;font-size:13px;}
#badge{position:absolute;bottom:65px;left:50%;transform:translateX(-50%);background:rgba(76,175,80,0.92);color:white;padding:5px 14px;border-radius:12px;font-size:11px;pointer-events:none;opacity:0;transition:opacity 0.4s;z-index:20;white-space:nowrap;}
/* transition editor canvas */
#tcvs{display:block;touch-action:none;border:1px solid #30363d;border-radius:6px;background:#eef5ff;cursor:crosshair;}
.tmodbtn{padding:6px 10px;border:1px solid #30363d;border-radius:6px;cursor:pointer;font-size:11px;background:#21262d;color:#e8e0d0;-webkit-tap-highlight-color:transparent;}
.tmodbtn.on{background:#2196F3;border-color:#2196F3;color:white;}
#dlg.fullscreen{border-radius:0;border:none;width:100vw;height:100vh;max-width:100vw;max-height:100vh;}
</style>
</head>
<body>
<div id="app">
  <div id="hdr">
    <div id="logo">SYNCHRO<b>BOARD</b></div>
    <span id="projname">Sans titre</span>
    <div class="hsp"></div>
    <button class="hico" id="bundo" title="Annuler">&#8617;</button>
    <span class="hico" id="zpct" style="cursor:default;font-size:10px;">100%</span>
    <button class="hbtn" id="bexport">PNG</button>
    <button class="hbtn" id="bprojs" style="background:#1a2a3a;border-color:#2196F3;color:#90c8ff;">Projets</button>
    <button class="hbtn" id="bsave" style="background:#1a3a1a;border-color:#4CAF50;color:#90EE90;">Sauver</button>
  </div>
  <div id="mid">
    <div id="sb"></div>
    <div id="cw">
      <canvas id="cvs"></canvas>
      <div id="pgbar"></div>
      <div id="badge"></div>
    </div>
    <div id="rp">
      <div class="plbl">Marqueurs</div>
      <div class="row"><span class="sm">Nombre</span>
        <div class="cnt">
          <button class="cntb" id="nsm">-</button><span class="cntv" id="nsv">16</span><button class="cntb" id="nsp">+</button>
        </div>
      </div>
      <div class="row"><span class="sm">Taille</span>
        <div class="cnt">
          <button class="cntb" id="szm">-</button><span class="cntv" id="szv">22</span><button class="cntb" id="szp">+</button>
        </div>
      </div>
      <div class="chkrow">
        <input type="checkbox" id="lblck" style="accent-color:#e63946;"/>
        <label for="lblck">Numeroter</label>
      </div>
      <div class="psep"></div>
      <div class="plbl">Formations</div>
      <div class="fgrid" id="fg"></div>
      <div class="psep"></div>
      <div class="plbl">Animation</div>
      <button class="gbtn" id="bplay">&#9654; Play</button>
      <button class="zbtn" id="btrans">Transitions...</button>
      <div style="font-size:9px;color:#555;line-height:1.5;">Croix numerotees animees vers schema suivant</div>
      <div class="psep"></div>
      <div class="plbl">Vue</div>
      <button class="zbtn" id="bzi">Zoom +</button>
      <button class="zbtn" id="bzo">Zoom -</button>
      <button class="zbtn" id="bct">Centrer</button>
      <div class="psep"></div>
      <button class="dbtn" id="bclr">Effacer tout</button>
      <button class="dbtn" id="bdelpage" style="color:#e63946;border-color:#5a1a1a;">Supprimer schema</button>
      <div class="tip">2 doigts = pan | Pinch = zoom</div>
    </div>
  </div>
  <div id="ov" style="display:none;"><div id="dlg"><div id="dlgbody"></div></div></div>
</div>
<script>
(function(){

var STORAGE_PREFIX = "sb2_proj_";
var STORAGE_LIST   = "sb2_projects";
var STORAGE_LAST   = "sb2_lastproj";
var COLORS = ["#1a1a2e","#e63946","#2196F3","#4CAF50","#FF9800","#9C27B0","#00BCD4","#ffffff"];
var TOOLS = [
  {id:"select",ic:"&#10010;",lb:"Sel"},
  {id:"cross", ic:"&#10005;",lb:"X"},
  {id:"pen",   ic:"&#9998;", lb:"Pen"},
  {id:"arrow", ic:"&#10148;",lb:"->"},
  {id:"line",  ic:"/",       lb:"/"},
  {id:"circle",ic:"&#9711;", lb:"O"},
  {id:"text",  ic:"T",       lb:"T"},
  {id:"erase", ic:"&#9003;", lb:"Del"}
];
var FORMATIONS = [
  {name:"Ligne",   fn:function(n){var a=[];for(var i=0;i<n;i++)a.push({x:50+i*38,y:150});return a;}},
  {name:"Cercle",  fn:function(n){var a=[];for(var i=0;i<n;i++)a.push({x:300+110*Math.cos(2*Math.PI*i/n),y:150+100*Math.sin(2*Math.PI*i/n)});return a;}},
  {name:"Roue",    fn:function(n){var sp=Math.ceil(n/2),a=[];for(var i=0;i<n;i++){var s=i%sp,sd=Math.floor(i/sp),ag=(2*Math.PI*s/sp)-Math.PI/2,rx=80+sd*70,ry=72+sd*63;a.push({x:300+rx*Math.cos(ag),y:150+ry*Math.sin(ag)});}return a;}},
  {name:"Bloc",    fn:function(n){var c2=Math.ceil(Math.sqrt(n)),a=[];for(var i=0;i<n;i++)a.push({x:130+(i%c2)*50,y:90+Math.floor(i/c2)*50});return a;}},
  {name:"V",       fn:function(n){var h=Math.floor(n/2),a=[];for(var i=0;i<n;i++){if(i<h)a.push({x:300-(h-i)*42,y:170+(h-i)*34});else a.push({x:300+(i-h+1)*42,y:170+(i-h+1)*34});}return a;}},
  {name:"Spirale", fn:function(n){var a=[];for(var i=0;i<n;i++)a.push({x:300+(18+i*11)*Math.cos(i*0.6),y:150+(18+i*11)*Math.sin(i*0.6)*0.9});return a;}}
];

var RW=600, RH=300;

// Project management
function getProjectList(){
  try{var r=localStorage.getItem(STORAGE_LIST);return r?JSON.parse(r):[];}catch(e){return [];}
}
function saveProjectList(list){
  try{localStorage.setItem(STORAGE_LIST,JSON.stringify(list));}catch(e){}
}
function loadProject(name){
  try{var r=localStorage.getItem(STORAGE_PREFIX+name);return r?JSON.parse(r):null;}catch(e){return null;}
}
function saveProject(name,data){
  try{
    localStorage.setItem(STORAGE_PREFIX+name,JSON.stringify(data));
    var list=getProjectList();
    if(list.indexOf(name)<0){list.push(name);saveProjectList(list);}
    localStorage.setItem(STORAGE_LAST,name);
  }catch(e){showBadge("Erreur: stockage plein?");}
}
function deleteProject(name){
  try{
    localStorage.removeItem(STORAGE_PREFIX+name);
    var list=getProjectList().filter(function(n){return n!==name;});
    saveProjectList(list);
  }catch(e){}
}

function defaultData(){
  return {pages:[{id:"p1",name:"Schema 1",els:[],hist:[[]],trans:{}}],curPage:"p1"};
}

// State
var currentProjectName = null;
var pages, curPage;

function loadInitial(){
  var last=null;
  try{last=localStorage.getItem(STORAGE_LAST);}catch(e){}
  var data=null;
  if(last)data=loadProject(last);
  if(data&&data.pages&&data.pages.length>0){
    pages=data.pages;curPage=data.curPage;currentProjectName=last;
    for(var i=0;i<pages.length;i++){if(!pages[i].hist)pages[i].hist=[[]];if(!pages[i].trans)pages[i].trans={};}
    var found=false;for(var i=0;i<pages.length;i++)if(pages[i].id===curPage)found=true;
    if(!found)curPage=pages[0].id;
  } else {
    var d=defaultData();pages=d.pages;curPage=d.curPage;
  }
  updateProjName();
}

function updateProjName(){
  document.getElementById("projname").textContent=currentProjectName||"Sans titre";
}

function doSave(name){
  currentProjectName=name;
  saveProject(name,{pages:pages,curPage:curPage});
  showBadge("Sauvegarde: "+name);
  updateProjName();
}

// Drawing state
var tool="cross",color="#e63946",strokeW=2,numSk=16,skSz=22;
var zoom=1,panX=0,panY=0;
var drawing=null,selected=null,dragging=null,dragOX=0,dragOY=0;
var panning=false,panSX=0,panSY=0;
var pendingTxt=null;
var idC=1;
function uid(){return "e"+(idC++);}
var pinchDist=null,pinchMX=0,pinchMY=0,lastTap=0;
var transitioning=false,transRAF=null;
var animating=false,animRAF=null;

var cvs=document.getElementById("cvs");
var ctx=cvs.getContext("2d");
var lastW=0,lastH=0;

function resize(){
  var wrap=document.getElementById("cw");
  var w=wrap.clientWidth,h=wrap.clientHeight;
  if(w===lastW&&h===lastH)return;
  lastW=w;lastH=h;cvs.width=w;cvs.height=h;fitRink();draw();
}
function fitRink(){
  var m=30;
  zoom=Math.min((cvs.width-m*2)/RW,(cvs.height-m*2)/RH);
  panX=(cvs.width-RW*zoom)/2;panY=(cvs.height-RH*zoom)/2;
}
window.addEventListener("resize",function(){setTimeout(resize,50);});

function getPage(){for(var i=0;i<pages.length;i++)if(pages[i].id===curPage)return pages[i];return pages[0];}
function getEls(){return getPage().els;}
function getElsOf(pid){for(var i=0;i<pages.length;i++)if(pages[i].id===pid)return pages[i].els;return [];}
function getPageIdx(pid){for(var i=0;i<pages.length;i++)if(pages[i].id===pid)return i;return -1;}
function getTransOf(pid){for(var i=0;i<pages.length;i++)if(pages[i].id===pid)return pages[i].trans||{};return {};}

function renamePages(){
  for(var i=0;i<pages.length;i++)pages[i].name="Schema "+(i+1);
}

function setEls(fn){
  for(var i=0;i<pages.length;i++){
    if(pages[i].id!==curPage)continue;
    var next=typeof fn==="function"?fn(pages[i].els):fn;
    var h=pages[i].hist.slice();h.push(next.slice());
    if(h.length>40)h=h.slice(h.length-40);
    pages[i]={id:pages[i].id,name:pages[i].name,els:next,hist:h,trans:pages[i].trans||{}};
    break;
  }
  draw();
}
function undo(){
  for(var i=0;i<pages.length;i++){
    if(pages[i].id!==curPage)continue;
    var h=pages[i].hist;if(h.length<=1)break;
    pages[i]={id:pages[i].id,name:pages[i].name,els:h[h.length-2].slice(),hist:h.slice(0,h.length-1),trans:pages[i].trans||{}};
    break;
  }
  draw();
}
function c2s(cx,cy){var r=cvs.getBoundingClientRect();return {x:(cx-r.left-panX)/zoom,y:(cy-r.top-panY)/zoom};}

function showBadge(msg,col){
  var b=document.getElementById("badge");
  b.textContent=msg;b.style.background=col||"rgba(76,175,80,0.92)";
  b.style.opacity="1";setTimeout(function(){b.style.opacity="0";},2000);
}

// Rink
function drawRink(c){
  var r2=28;
  c.save();
  c.beginPath();c.moveTo(r2,0);c.lineTo(RW-r2,0);c.quadraticCurveTo(RW,0,RW,r2);c.lineTo(RW,RH-r2);c.quadraticCurveTo(RW,RH,RW-r2,RH);c.lineTo(r2,RH);c.quadraticCurveTo(0,RH,0,RH-r2);c.lineTo(0,r2);c.quadraticCurveTo(0,0,r2,0);c.closePath();
  c.fillStyle="#eef5ff";c.fill();
  c.save();c.clip();
  c.strokeStyle="#cc0000";c.lineWidth=2;
  c.beginPath();c.moveTo(RW/2,0);c.lineTo(RW/2,RH);c.stroke();
  c.beginPath();c.arc(RW/2,RH/2,75,0,2*Math.PI);c.stroke();
  c.fillStyle="#cc0000";c.beginPath();c.arc(RW/2,RH/2,5,0,2*Math.PI);c.fill();
  c.restore();
  c.beginPath();c.moveTo(r2,0);c.lineTo(RW-r2,0);c.quadraticCurveTo(RW,0,RW,r2);c.lineTo(RW,RH-r2);c.quadraticCurveTo(RW,RH,RW-r2,RH);c.lineTo(r2,RH);c.quadraticCurveTo(0,RH,0,RH-r2);c.lineTo(0,r2);c.quadraticCurveTo(0,0,r2,0);c.closePath();
  c.strokeStyle="#99b8d4";c.lineWidth=3;c.stroke();
  c.restore();
}

function drawEl(c,el,sel){
  c.save();
  if(sel){c.shadowColor="rgba(255,210,0,0.95)";c.shadowBlur=10;}
  if(el.type==="cross"){
    var hs=el.sz*0.45;
    c.strokeStyle=el.col;c.lineWidth=Math.max(2,el.sz*0.15);c.lineCap="round";
    c.beginPath();c.moveTo(el.x-hs,el.y-hs);c.lineTo(el.x+hs,el.y+hs);c.stroke();
    c.beginPath();c.moveTo(el.x+hs,el.y-hs);c.lineTo(el.x-hs,el.y+hs);c.stroke();
    if(el.lbl){c.font="bold 10px Georgia";c.fillStyle=el.col;c.shadowBlur=0;c.textAlign="left";c.textBaseline="top";c.fillText(el.lbl,el.x+hs+2,el.y-hs);}
  } else if(el.type==="path"&&el.pts.length>1){
    c.strokeStyle=el.col;c.lineWidth=el.w;c.lineCap="round";c.lineJoin="round";
    c.beginPath();c.moveTo(el.pts[0].x,el.pts[0].y);
    for(var i=1;i<el.pts.length;i++)c.lineTo(el.pts[i].x,el.pts[i].y);
    c.stroke();
  } else if(el.type==="line"){
    c.strokeStyle=el.col;c.lineWidth=el.w;c.lineCap="round";
    c.beginPath();c.moveTo(el.x1,el.y1);c.lineTo(el.x2,el.y2);c.stroke();
  } else if(el.type==="arrow"){
    drawArrow(c,el.x1,el.y1,el.x2,el.y2,el.col,el.w);
  } else if(el.type==="circle"){
    c.strokeStyle=el.col;c.lineWidth=el.w;
    c.beginPath();c.arc(el.cx,el.cy,el.r,0,2*Math.PI);c.stroke();
  } else if(el.type==="text"){
    c.font=el.sz+"px Georgia";c.fillStyle=el.col;c.textBaseline="top";c.shadowBlur=0;
    c.fillText(el.txt,el.x,el.y);
  }
  c.restore();
}

function drawCrossAt(c,x,y,sz,col,lbl){
  var hs=sz*0.45;
  c.save();c.strokeStyle=col;c.lineWidth=Math.max(2,sz*0.15);c.lineCap="round";
  c.beginPath();c.moveTo(x-hs,y-hs);c.lineTo(x+hs,y+hs);c.stroke();
  c.beginPath();c.moveTo(x+hs,y-hs);c.lineTo(x-hs,y+hs);c.stroke();
  if(lbl){c.font="bold 10px Georgia";c.fillStyle=col;c.textAlign="left";c.textBaseline="top";c.fillText(lbl,x+hs+2,y-hs);}
  c.restore();
}

function drawArrow(c,x1,y1,x2,y2,col,lw){
  var dx=x2-x1,dy=y2-y1,len=Math.sqrt(dx*dx+dy*dy);if(len<2)return;
  var hl=Math.min(16,len*0.4),hw=hl*0.5,ux=dx/len,uy=dy/len;
  var ax=x2-hl*ux,ay=y2-hl*uy;
  c.save();c.strokeStyle=col;c.lineWidth=lw;c.lineCap="round";
  c.beginPath();c.moveTo(x1,y1);c.lineTo(ax,ay);c.stroke();
  c.beginPath();c.moveTo(x2,y2);c.lineTo(ax-hw*uy,ay+hw*ux);c.lineTo(ax+hw*uy,ay-hw*ux);c.closePath();
  c.fillStyle=col;c.fill();c.restore();
}

function draw(){
  if(transitioning||animating)return;
  ctx.clearRect(0,0,cvs.width,cvs.height);
  ctx.save();ctx.translate(panX,panY);ctx.scale(zoom,zoom);
  drawRink(ctx);
  var els=getEls();for(var i=0;i<els.length;i++)drawEl(ctx,els[i],els[i].id===selected);
  if(drawing)drawLive();
  ctx.restore();
  document.getElementById("zpct").textContent=Math.round(zoom*100)+"%";
}

function drawLive(){
  var d=drawing;ctx.save();ctx.strokeStyle=d.col;ctx.lineWidth=d.w;ctx.lineCap="round";ctx.lineJoin="round";
  if(d.type==="path"&&d.pts.length>1){
    ctx.beginPath();ctx.moveTo(d.pts[0].x,d.pts[0].y);
    for(var i=1;i<d.pts.length;i++)ctx.lineTo(d.pts[i].x,d.pts[i].y);ctx.stroke();
  } else if(d.type==="line"){ctx.beginPath();ctx.moveTo(d.x1,d.y1);ctx.lineTo(d.x2,d.y2);ctx.stroke();}
  else if(d.type==="arrow"){drawArrow(ctx,d.x1,d.y1,d.x2,d.y2,d.col,d.w);}
  else if(d.type==="circle"&&d.r>0){ctx.beginPath();ctx.arc(d.cx,d.cy,d.r,0,2*Math.PI);ctx.stroke();}
  ctx.restore();
}

// Interpolate position along a path (normalized t 0..1)
function interpPath(pts,t){
  if(!pts||pts.length<2)return null;
  // compute cumulative lengths
  var lens=[0];
  for(var i=1;i<pts.length;i++){
    var dx=pts[i].x-pts[i-1].x,dy=pts[i].y-pts[i-1].y;
    lens.push(lens[i-1]+Math.sqrt(dx*dx+dy*dy));
  }
  var total=lens[lens.length-1];
  if(total===0)return {x:pts[0].x,y:pts[0].y};
  var target=t*total;
  for(var i=1;i<pts.length;i++){
    if(lens[i]>=target){
      var seg=lens[i]-lens[i-1];
      var tt=seg===0?0:(target-lens[i-1])/seg;
      return {x:pts[i-1].x+(pts[i].x-pts[i-1].x)*tt, y:pts[i-1].y+(pts[i].y-pts[i-1].y)*tt};
    }
  }
  return pts[pts.length-1];
}

// Get position of cross at time t given transition type
function getPos(fc,tc,trans,t){
  if(!tc)return {x:fc.x,y:fc.y};
  var type=(trans&&trans[fc.lbl]&&trans[fc.lbl].type)||"line";
  if(type==="line"){
    return {x:fc.x+(tc.x-fc.x)*t, y:fc.y+(tc.y-fc.y)*t};
  } else if(type==="arcL"||type==="arcR"){
    // Arc: control point perpendicular to midpoint
    var mx=(fc.x+tc.x)/2,my=(fc.y+tc.y)/2;
    var dx=tc.x-fc.x,dy=tc.y-fc.y;
    var len=Math.sqrt(dx*dx+dy*dy);
    var nx=-dy/len,ny=dx/len; // perpendicular
    var sign=(type==="arcL")?1:-1;
    var bulge=len*0.4*sign;
    var cpx=mx+nx*bulge,cpy=my+ny*bulge;
    // Quadratic bezier
    var it=1-t;
    return {x:it*it*fc.x+2*it*t*cpx+t*t*tc.x, y:it*it*fc.y+2*it*t*cpy+t*t*tc.y};
  } else if(type==="custom"){
    // custom path stored as array of points in trans[lbl].path
    var pts=trans[fc.lbl].path;
    if(pts&&pts.length>1)return interpPath(pts,t);
    return {x:fc.x+(tc.x-fc.x)*t,y:fc.y+(tc.y-fc.y)*t};
  }
  return {x:fc.x+(tc.x-fc.x)*t,y:fc.y+(tc.y-fc.y)*t};
}

// Play animation
function playAnimation(){
  if(animating)return;
  var idx=getPageIdx(curPage);
  if(idx<0||idx>=pages.length-1){showBadge("Dernier schema",  "rgba(180,80,30,0.92)");return;}
  var nextId=pages[idx+1].id;
  var fromEls=getElsOf(curPage),toEls=getElsOf(nextId);
  var statics=fromEls.filter(function(e){return e.type!=="cross";});
  var fromX=fromEls.filter(function(e){return e.type==="cross";});
  var toX=toEls.filter(function(e){return e.type==="cross";});
  var toMap={};for(var i=0;i<toX.length;i++)if(toX[i].lbl)toMap[toX[i].lbl]=toX[i];
  var pairs=fromX.map(function(fc){return {fc:fc,tc:fc.lbl&&toMap[fc.lbl]?toMap[fc.lbl]:null};});
  if(pairs.length===0){showBadge("Aucune croix a animer","rgba(180,80,30,0.92)");return;}
  var trans=getTransOf(curPage);
  animating=true;var start=null;var DUR=1400;
  function ease(t){return t<0.5?2*t*t:(-1+(4-2*t)*t);}
  function step(ts){
    if(!start)start=ts;
    var t=ease(Math.min((ts-start)/DUR,1));
    ctx.clearRect(0,0,cvs.width,cvs.height);
    ctx.save();ctx.translate(panX,panY);ctx.scale(zoom,zoom);
    drawRink(ctx);
    for(var i=0;i<statics.length;i++)drawEl(ctx,statics[i],false);
    for(var i=0;i<pairs.length;i++){
      var fc=pairs[i].fc,tc=pairs[i].tc;
      // Draw trajectory preview
      if(tc){
        var ttype=(trans[fc.lbl]&&trans[fc.lbl].type)||"line";
        ctx.save();ctx.globalAlpha=0.2;ctx.strokeStyle=fc.col;ctx.lineWidth=1;ctx.setLineDash([4,4]);
        if(ttype==="line"){
          ctx.beginPath();ctx.moveTo(fc.x,fc.y);ctx.lineTo(tc.x,tc.y);ctx.stroke();
        } else if(ttype==="arcL"||ttype==="arcR"){
          var mx2=(fc.x+tc.x)/2,my2=(fc.y+tc.y)/2;
          var dx2=tc.x-fc.x,dy2=tc.y-fc.y,len2=Math.sqrt(dx2*dx2+dy2*dy2);
          var nx2=-dy2/len2,ny2=dx2/len2,sign2=(ttype==="arcL")?1:-1,bulge2=len2*0.4*sign2;
          ctx.beginPath();ctx.moveTo(fc.x,fc.y);ctx.quadraticCurveTo(mx2+nx2*bulge2,my2+ny2*bulge2,tc.x,tc.y);ctx.stroke();
        } else if(ttype==="custom"&&trans[fc.lbl]&&trans[fc.lbl].path){
          var pp=trans[fc.lbl].path;
          if(pp.length>1){ctx.beginPath();ctx.moveTo(pp[0].x,pp[0].y);for(var k=1;k<pp.length;k++)ctx.lineTo(pp[k].x,pp[k].y);ctx.stroke();}
        }
        ctx.restore();
      }
      var pos=getPos(fc,tc,trans,t);
      drawCrossAt(ctx,pos.x,pos.y,fc.sz,fc.col,fc.lbl);
    }
    ctx.restore();
    if(t<1)animRAF=requestAnimationFrame(step);
    else{animating=false;curPage=nextId;buildPgBar();draw();}
  }
  animRAF=requestAnimationFrame(step);
}

    var cx=e.touches?e.touches[0].clientX:e.clientX;
    var cy=e.touches?e.touches[0].clientY:e.clientY;

  },false);
  tc2.addEventListener("mousemove",function(e){
    if(!drawingPath)return;
    pathPts.push(tPos(e));renderPreview();
  },false);
  tc2.addEventListener("mouseup",function(){drawingPath=false;},false);
  tc2.addEventListener("touchstart",function(e){
    e.preventDefault();
    if(curMode!=="custom")return;
    drawingPath=true;pathPts=[tPos(e)];
  },{passive:false});
  tc2.addEventListener("touchmove",function(e){
    e.preventDefault();
    if(!drawingPath)return;
    pathPts.push(tPos(e));renderPreview();
  },{passive:false});
  tc2.addEventListener("touchend",function(e){e.preventDefault();drawingPath=false;},{passive:false});

  // Update button active states only (no DOM rebuild)
  function updateButtons(){
    // Tab buttons
    var tabs=tabrow.querySelectorAll("[data-lbl]");
    for(var i=0;i<tabs.length;i++){
      var lb=tabs[i].getAttribute("data-lbl");

    var h=document.getElementById("te_hint");
    if(h)h.textContent=curMode==="custom"?"Dessinez le trajet de la croix "+previewLbl+" (doigt sur la patinoire)":"";
    // Canvas cursor
    tc2.style.cursor=curMode==="custom"?"crosshair":"default";
  }

  // Render preview on persistent canvas
  function renderPreview(){
    if(!tc2)return;
    // Sync canvas pixel size to CSS size
    // Never resize during draw - size is fixed at open time
    var W=tc2.width||600;var H=tc2.height||300;
    var sx=W/RW;var sy=H/RH;
    var cv=tc2.getContext("2d");
    cv.clearRect(0,0,W,H);
    // Rink background
    cv.fillStyle="#eef5ff";cv.fillRect(0,0,W,H);
    cv.strokeStyle="#cc0000";cv.lineWidth=1;
    cv.beginPath();cv.moveTo(W/2,0);cv.lineTo(W/2,H);cv.stroke();
    cv.beginPath();cv.arc(W/2,H/2,75*sx,0,2*Math.PI);cv.stroke();
    cv.strokeStyle="#99b8d4";cv.lineWidth=2;
    var rr=28*Math.min(sx,sy);
    cv.beginPath();cv.moveTo(rr,0);cv.lineTo(W-rr,0);cv.quadraticCurveTo(W,0,W,rr);cv.lineTo(W,H-rr);cv.quadraticCurveTo(W,H,W-rr,H);cv.lineTo(rr,H);cv.quadraticCurveTo(0,H,0,H-rr);cv.lineTo(0,rr);cv.quadraticCurveTo(0,0,rr,0);cv.closePath();cv.stroke();

    for(var i=0;i<fromX.length;i++){
      var fc=fromX[i];
      var toEl=toMap[fc.lbl];
      if(!toEl)continue;
      var isSel=!!selLabels[fc.lbl];
      var isPreview=(fc.lbl===previewLbl);
      var fx=fc.x*sx;var fy=fc.y*sy;
      var tx=toEl.x*sx;var ty=toEl.y*sy;
      // For selected crosses: show curMode (what user is choosing)
      // For unselected crosses: show their saved type from trans
      var ttype=isSel?curMode:((trans[fc.lbl]&&trans[fc.lbl].type)||"line");

      // Draw path
      cv.save();
      cv.strokeStyle=isSel?"#2196F3":"#aaaaaa";
      cv.lineWidth=isSel?2.5:1;
      cv.globalAlpha=isSel?0.85:0.25;
      if(ttype==="line"){
        cv.beginPath();cv.moveTo(fx,fy);cv.lineTo(tx,ty);cv.stroke();
      } else if(ttype==="arcL"||ttype==="arcR"){
        var mx2=(fx+tx)/2;var my2=(fy+ty)/2;
        var dx2=tx-fx;var dy2=ty-fy;var len2=Math.sqrt(dx2*dx2+dy2*dy2);
        if(len2>0){
          var nx2=-dy2/len2;var ny2=dx2/len2;
          var sign2=(ttype==="arcL")?1:-1;var b2=len2*0.4*sign2;
          cv.beginPath();cv.moveTo(fx,fy);cv.quadraticCurveTo(mx2+nx2*b2,my2+ny2*b2,tx,ty);cv.stroke();
        }
      } else if(ttype==="custom"){
        var pts=(isPreview&&pathPts.length>1)?pathPts:((trans[fc.lbl]&&trans[fc.lbl].path)||null);
        if(pts&&pts.length>1){
          cv.beginPath();cv.moveTo(pts[0].x*sx,pts[0].y*sy);
          for(var k=1;k<pts.length;k++)cv.lineTo(pts[k].x*sx,pts[k].y*sy);
          cv.stroke();
        }
      }
      cv.restore();

      // From cross (blue)
      var hsz=isSel?11:7;
      cv.save();cv.strokeStyle=isSel?"#2196F3":"#8899aa";cv.lineWidth=isSel?2.5:1.5;
      cv.beginPath();cv.moveTo(fx-hsz,fy-hsz);cv.lineTo(fx+hsz,fy+hsz);cv.stroke();
      cv.beginPath();cv.moveTo(fx+hsz,fy-hsz);cv.lineTo(fx-hsz,fy+hsz);cv.stroke();
      cv.font="bold "+(isSel?11:9)+"px Georgia";cv.fillStyle=isSel?"#2196F3":"#8899aa";
      cv.textAlign="left";cv.textBaseline="top";cv.fillText(fc.lbl,fx+hsz+2,fy-hsz);
      cv.restore();

      // To cross (green)
      var thsz=isSel?9:6;
      cv.save();cv.strokeStyle=isSel?"#4CAF50":"#88aa88";cv.lineWidth=isSel?2:1;cv.globalAlpha=0.7;
      cv.beginPath();cv.moveTo(tx-thsz,ty-thsz);cv.lineTo(tx+thsz,ty+thsz);cv.stroke();
      cv.beginPath();cv.moveTo(tx+thsz,ty-thsz);cv.lineTo(tx-thsz,ty+thsz);cv.stroke();
      cv.restore();
    }
  }

  // Initial render - wait one frame for layout
  updateButtons();
  // Set canvas size once - never change after this
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      var cw=tc2.offsetWidth;
      // Fix height = width * RH/RW (preserve rink aspect ratio)
      var ch=Math.round(cw*RH/RW);
      if(cw>0){
        tc2.width=cw;
        tc2.height=ch;
        tc2.style.height=ch+"px"; // lock CSS height too so flex can't change it
      }
      renderPreview();
    });
  });
}


// Hit test
function hit(sx,sy){
  var els=getEls();
  for(var i=els.length-1;i>=0;i--){
    var el=els[i];
    if(el.type==="cross"){if(Math.sqrt((sx-el.x)*(sx-el.x)+(sy-el.y)*(sy-el.y))<el.sz*0.9)return el.id;}
    else if(el.type==="text"){ctx.font=el.sz+"px Georgia";var tw=ctx.measureText(el.txt).width;if(sx>=el.x&&sx<=el.x+tw&&sy>=el.y&&sy<=el.y+el.sz)return el.id;}
    else if(el.type==="path"){for(var j=0;j<el.pts.length-1;j++){if(d2seg(sx,sy,el.pts[j].x,el.pts[j].y,el.pts[j+1].x,el.pts[j+1].y)<el.w+6)return el.id;}}
    else if(el.type==="line"||el.type==="arrow"){if(d2seg(sx,sy,el.x1,el.y1,el.x2,el.y2)<el.w+6)return el.id;}
    else if(el.type==="circle"){if(Math.abs(Math.sqrt((sx-el.cx)*(sx-el.cx)+(sy-el.cy)*(sy-el.cy))-el.r)<el.w+6)return el.id;}
  }
  return null;
}
function d2seg(px,py,ax,ay,bx,by){
  var dx=bx-ax,dy=by-ay,l2=dx*dx+dy*dy;if(l2===0)return Math.sqrt((px-ax)*(px-ax)+(py-ay)*(py-ay));
  var t=Math.max(0,Math.min(1,((px-ax)*dx+(py-ay)*dy)/l2));
  return Math.sqrt((px-(ax+t*dx))*(px-(ax+t*dx))+(py-(ay+t*dy))*(py-(ay+t*dy)));
}

// Input
function onDown(cx,cy){
  if(transitioning||animating)return;
  var pos=c2s(cx,cy);
  if(tool==="erase"){var id=hit(pos.x,pos.y);if(id)setEls(function(els){return els.filter(function(e){return e.id!==id;});});return;}
  if(tool==="select"){
    var hid=hit(pos.x,pos.y);
    if(hid){
      selected=hid;dragging=hid;
      var el=getEls().filter(function(e){return e.id===hid;})[0];
      if(el){var bx=(el.type==="circle")?el.cx:(el.x1!==undefined?el.x1:el.x);var by=(el.type==="circle")?el.cy:(el.y1!==undefined?el.y1:el.y);dragOX=pos.x-bx;dragOY=pos.y-by;}
    } else {selected=null;panning=true;panSX=cx-panX;panSY=cy-panY;}
    draw();return;
  }
  if(tool==="cross"){
    var lb=document.getElementById("lblck").checked;
    var cnt=getEls().filter(function(e){return e.type==="cross";}).length;
    setEls(function(els){return els.concat([{id:uid(),type:"cross",x:pos.x,y:pos.y,col:color,sz:skSz,lbl:lb?String(cnt+1):""}]);});return;
  }
  if(tool==="text"){pendingTxt=pos;showTextDlg();return;}
  if(tool==="pen"){drawing={id:uid(),type:"path",pts:[pos],col:color,w:strokeW};return;}
  if(tool==="arrow"||tool==="line"){drawing={id:uid(),type:tool,x1:pos.x,y1:pos.y,x2:pos.x,y2:pos.y,col:color,w:strokeW};return;}
  if(tool==="circle"){drawing={id:uid(),type:"circle",cx:pos.x,cy:pos.y,r:0,col:color,w:strokeW};return;}
}
function onMove(cx,cy){
  if(transitioning||animating)return;
  var pos=c2s(cx,cy);
  if(panning&&tool==="select"){panX=cx-panSX;panY=cy-panSY;draw();return;}
  if(dragging){
    setEls(function(els){return els.map(function(el){
      if(el.id!==dragging)return el;
      if(el.type==="cross"||el.type==="text")return {id:el.id,type:el.type,x:pos.x-dragOX,y:pos.y-dragOY,col:el.col,sz:el.sz,lbl:el.lbl,txt:el.txt};
      if(el.type==="circle")return {id:el.id,type:"circle",cx:pos.x-dragOX,cy:pos.y-dragOY,r:el.r,col:el.col,w:el.w};
      if(el.type==="line"||el.type==="arrow"){var ddx=(pos.x-dragOX)-el.x1,ddy=(pos.y-dragOY)-el.y1;return {id:el.id,type:el.type,x1:el.x1+ddx,y1:el.y1+ddy,x2:el.x2+ddx,y2:el.y2+ddy,col:el.col,w:el.w};}
      return el;
    });});return;
  }
  if(!drawing)return;
  if(drawing.type==="path")drawing.pts=drawing.pts.concat([pos]);
  else if(drawing.type==="arrow"||drawing.type==="line"){drawing.x2=pos.x;drawing.y2=pos.y;}
  else if(drawing.type==="circle"){var dx4=pos.x-drawing.cx,dy4=pos.y-drawing.cy;drawing.r=Math.sqrt(dx4*dx4+dy4*dy4);}
  draw();
}
function onUp(){
  panning=false;
  if(dragging){dragging=null;draw();return;}
  if(!drawing)return;
  var d=drawing;drawing=null;var ok=false;
  if(d.type==="path"&&d.pts.length>2)ok=true;
  else if(d.type==="arrow"||d.type==="line"){var dx5=d.x2-d.x1,dy5=d.y2-d.y1;if(Math.sqrt(dx5*dx5+dy5*dy5)>5)ok=true;}
  else if(d.type==="circle"&&d.r>5)ok=true;
  if(ok)setEls(function(els){return els.concat([d]);});else draw();
}

cvs.addEventListener("mousedown",function(e){if(e.button===0)onDown(e.clientX,e.clientY);},false);
cvs.addEventListener("mousemove",function(e){onMove(e.clientX,e.clientY);},false);
cvs.addEventListener("mouseup",onUp,false);
cvs.addEventListener("mouseleave",onUp,false);
cvs.addEventListener("wheel",function(e){
  e.preventDefault();if(animating)return;
  var r=cvs.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
  var f=e.deltaY<0?1.1:0.9,nz=Math.min(8,Math.max(0.1,zoom*f));
  panX=mx-(mx-panX)*(nz/zoom);panY=my-(my-panY)*(nz/zoom);zoom=nz;draw();
},{passive:false});
cvs.addEventListener("touchstart",function(e){
  e.preventDefault();
  if(e.touches.length===2){
    drawing=null;panning=false;dragging=null;
    var t0=e.touches[0],t1=e.touches[1],dx6=t1.clientX-t0.clientX,dy6=t1.clientY-t0.clientY;
    pinchDist=Math.sqrt(dx6*dx6+dy6*dy6);pinchMX=(t0.clientX+t1.clientX)/2;pinchMY=(t0.clientY+t1.clientY)/2;
  } else if(e.touches.length===1){
    var now=Date.now();if(now-lastTap<280){lastTap=0;return;}lastTap=now;
    pinchDist=null;onDown(e.touches[0].clientX,e.touches[0].clientY);
  }
},{passive:false});
cvs.addEventListener("touchmove",function(e){
  e.preventDefault();
  if(e.touches.length===2){
    var t0=e.touches[0],t1=e.touches[1],dx7=t1.clientX-t0.clientX,dy7=t1.clientY-t0.clientY;
    var dist=Math.sqrt(dx7*dx7+dy7*dy7),mx=(t0.clientX+t1.clientX)/2,my=(t0.clientY+t1.clientY)/2;
    var r=cvs.getBoundingClientRect(),lx=mx-r.left,ly=my-r.top;
    if(pinchDist){var f=dist/pinchDist,nz=Math.min(8,Math.max(0.1,zoom*f));panX=lx-(lx-panX)*(nz/zoom);panY=ly-(ly-panY)*(nz/zoom);zoom=nz;panX+=mx-pinchMX;panY+=my-pinchMY;}
    pinchDist=dist;pinchMX=mx;pinchMY=my;draw();
  } else if(e.touches.length===1)onMove(e.touches[0].clientX,e.touches[0].clientY);
},{passive:false});
cvs.addEventListener("touchend",function(e){
  e.preventDefault();if(e.touches.length===0){pinchDist=null;onUp();}else if(e.touches.length===1)pinchDist=null;
},{passive:false});

// Page transition
function ease2(t){return t<0.5?2*t*t:(-1+(4-2*t)*t);}
function animTrans(fromId,toId,dir){
  if(transitioning&&transRAF){cancelAnimationFrame(transRAF);transitioning=false;}
  transitioning=true;selected=null;drawing=null;var start=null;
  function step(ts){
    if(!start)start=ts;var t=ease2(Math.min((ts-start)/300,1));
    ctx.clearRect(0,0,cvs.width,cvs.height);
    ctx.save();ctx.translate(panX+dir*t*cvs.width,panY);ctx.scale(zoom,zoom);
    drawRink(ctx);var fe=getElsOf(fromId);for(var i=0;i<fe.length;i++)drawEl(ctx,fe[i],false);ctx.restore();
    ctx.save();ctx.translate(panX+dir*(-(1-t))*cvs.width,panY);ctx.scale(zoom,zoom);
    drawRink(ctx);var te=getElsOf(toId);for(var i=0;i<te.length;i++)drawEl(ctx,te[i],false);ctx.restore();
    if(t<1)transRAF=requestAnimationFrame(step);
    else{transitioning=false;curPage=toId;buildPgBar();draw();}
  }
  transRAF=requestAnimationFrame(step);
}

// Dialog
function showDlg(html){
  document.getElementById("dlgbody").innerHTML=html;
  document.getElementById("ov").style.display="flex";
  return function(){document.getElementById("ov").style.display="none";document.getElementById("dlgbody").innerHTML="";};
}

function showTextDlg(){
  var close=showDlg(
    '<div style="font-size:12px;color:#aaa;margin-bottom:8px;">Texte:</div>'+
    '<input type="text" id="ti" placeholder="Ex: Ligne A" style="background:#21262d;border:1px solid #444;border-radius:4px;color:#e8e0d0;padding:7px 10px;font-size:15px;outline:none;font-family:Georgia,serif;width:100%;"/>'+
    '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px;"><button class="dno" id="dtno">Annuler</button><button class="dok" id="dtok">OK</button></div>'
  );
  setTimeout(function(){var ti=document.getElementById("ti");if(ti)ti.focus();},60);
  document.getElementById("dtno").onclick=function(){close();pendingTxt=null;};
  document.getElementById("dtok").onclick=function(){
    var ti=document.getElementById("ti"),v=ti?ti.value.trim():"";close();
    if(v&&pendingTxt){var p=pendingTxt;setEls(function(els){return els.concat([{id:uid(),type:"text",x:p.x,y:p.y,txt:v,col:color,sz:16}]);});}
    pendingTxt=null;
  };
}

function showConfirm(msg,onYes){
  var close=showDlg(
    '<div style="font-size:13px;color:#e8e0d0;margin-bottom:14px;">'+msg+'</div>'+
    '<div style="display:flex;gap:8px;justify-content:flex-end;"><button class="dno" id="dcno">Annuler</button><button class="dok" id="dcyes" style="background:#c0392b;">Confirmer</button></div>'
  );
  document.getElementById("dcno").onclick=function(){close();};
  document.getElementById("dcyes").onclick=function(){close();onYes();};
}

// Projects dialog
function openProjects(){
  var list=getProjectList();
  var html='<div style="font-size:14px;font-weight:bold;color:#e8e0d0;margin-bottom:10px;">Mes projets</div>';
  // Save current as new
  html+='<div style="font-size:11px;color:#aaa;margin-bottom:4px;">Sauvegarder sous un nouveau nom:</div>'+
    '<div style="display:flex;gap:6px;margin-bottom:12px;">'+
    '<input type="text" id="pnew" placeholder="Nom du projet" style="flex:1;background:#21262d;border:1px solid #444;border-radius:4px;color:#e8e0d0;padding:5px 8px;font-size:13px;outline:none;font-family:Georgia,serif;"/>'+
    '<button class="dgn" id="pbsave">Sauver</button></div>';
  // List of existing
  if(list.length>0){
    html+='<div style="font-size:11px;color:#aaa;margin-bottom:6px;">Projets sauvegardes:</div>'+
      '<div id="projlist" style="display:flex;flex-direction:column;gap:5px;max-height:240px;overflow-y:auto;">';
    for(var i=0;i<list.length;i++){
      var n=list[i],isCur=(n===currentProjectName);
      html+='<div style="display:flex;align-items:center;gap:6px;padding:5px 8px;background:'+(isCur?"#1a3a1a":"#21262d")+';border-radius:5px;border:1px solid '+(isCur?"#4CAF50":"#30363d")+';">'+
        '<span style="flex:1;font-size:12px;color:'+(isCur?"#90EE90":"#e8e0d0")+';">'+n+(isCur?" (actuel)":"")+'</span>'+
        '<button style="padding:3px 8px;background:#1a2a3a;border:1px solid #2196F3;border-radius:4px;color:#90c8ff;cursor:pointer;font-size:10px;" onclick="window._sbProjLoad(\''+n+'\')">Ouvrir</button>'+
        '<button style="padding:3px 8px;background:transparent;border:1px solid #5a1a1a;border-radius:4px;color:#e63946;cursor:pointer;font-size:10px;" onclick="window._sbProjDel(\''+n+'\')">Suppr</button></div>';
    }
    html+='</div>';
  } else {
    html+='<div style="font-size:11px;color:#555;font-style:italic;">Aucun projet sauvegarde</div>';
  }
  html+='<div style="display:flex;gap:6px;justify-content:flex-end;margin-top:12px;"><button class="dno" id="pbnew" style="color:#90c8ff;border-color:#2196F3;">+ Nouveau projet</button><button class="dno" id="pbclose">Fermer</button></div>';

  var close=showDlg(html);
  setTimeout(function(){var inp=document.getElementById("pnew");if(inp&&currentProjectName)inp.value=currentProjectName;},30);
  document.getElementById("pbclose").onclick=function(){close();};
  document.getElementById("pbnew").onclick=function(){
    close();
    // Reset to blank project
    var d=defaultData();pages=d.pages;curPage=d.curPage;currentProjectName=null;
    selected=null;drawing=null;updateProjName();buildPgBar();fitRink();draw();
    showBadge("Nouveau projet cree");
  };
  document.getElementById("pbsave").onclick=function(){
    var inp=document.getElementById("pnew"),name=inp?inp.value.trim():"";
    if(!name){showBadge("Entrez un nom","rgba(180,80,30,0.92)");return;}
    doSave(name);close();
  };
  window._sbProjLoad=function(name){
    var data=loadProject(name);
    if(!data||!data.pages){showBadge("Erreur de chargement","rgba(180,80,30,0.92)");return;}
    pages=data.pages;curPage=data.curPage;currentProjectName=name;
    for(var i=0;i<pages.length;i++){if(!pages[i].hist)pages[i].hist=[[]];if(!pages[i].trans)pages[i].trans={};}
    var found=false;for(var i=0;i<pages.length;i++)if(pages[i].id===curPage)found=true;
    if(!found)curPage=pages[0].id;
    try{localStorage.setItem(STORAGE_LAST,name);}catch(e){}
    selected=null;drawing=null;close();updateProjName();buildPgBar();fitRink();draw();
    showBadge("Projet ouvert: "+name);
  };
  window._sbProjDel=function(name){
    if(name===currentProjectName){showBadge("Fermez d'abord ce projet","rgba(180,80,30,0.92)");return;}
    deleteProject(name);close();openProjects();
  };
}

document.getElementById("bundo").onclick=undo;
document.getElementById("bsave").onclick=function(){
  if(currentProjectName){doSave(currentProjectName);}
  else{openProjects();}
};
document.getElementById("bprojs").onclick=openProjects;

document.getElementById("bzo").onclick=function(){zoom=Math.max(0.1,zoom*0.8);draw();};
document.getElementById("bct").onclick=function(){fitRink();draw();};
document.getElementById("bclr").onclick=function(){
  showConfirm("Effacer tous les elements de ce schema?",function(){
    for(var i=0;i<pages.length;i++){if(pages[i].id===curPage){pages[i]={id:pages[i].id,name:pages[i].name,els:[],hist:[[]],trans:{}};break;}}

  });
};
document.getElementById("bdelpage").onclick=function(){

  showConfirm("Supprimer ce schema?",function(){
    var idx=getPageIdx(curPage);pages.splice(idx,1);
    renamePages();
    curPage=pages[Math.max(0,idx-1)].id;
    selected=null;drawing=null;buildPgBar();draw();
  });
};
document.getElementById("bexport").onclick=function(){
  var tmp=document.createElement("canvas");tmp.width=cvs.width;tmp.height=cvs.height;
  var tc=tmp.getContext("2d");tc.fillStyle="#ffffff";tc.fillRect(0,0,tmp.width,tmp.height);tc.drawImage(cvs,0,0);

  var close=showDlg(
    '<div style="font-size:12px;color:#aaa;margin-bottom:8px;">Appui long -> Enregistrer dans Photos</div>'+
    '<img src="'+url+'" style="max-width:100%;border-radius:6px;display:block;"/>'+
    '<div style="display:flex;justify-content:flex-end;margin-top:8px;"><button class="dno" id="dexcl">Fermer</button></div>'
  );
  document.getElementById("dexcl").onclick=function(){close();};
};
document.getElementById("nsm").onclick=function(){if(numSk>1){numSk--;document.getElementById("nsv").textContent=numSk;}};
document.getElementById("nsp").onclick=function(){if(numSk<30){numSk++;document.getElementById("nsv").textContent=numSk;}};
document.getElementById("szm").onclick=function(){if(skSz>12){skSz-=2;document.getElementById("szv").textContent=skSz;}};
document.getElementById("szp").onclick=function(){if(skSz<40){skSz+=2;document.getElementById("szv").textContent=skSz;}};

// Sidebar
function buildSidebar(){
  var sb=document.getElementById("sb");if(sb.children.length>0)return;
  for(var i=0;i<TOOLS.length;i++){(function(t){
    var btn=document.createElement("button");btn.className="tbtn";btn.setAttribute("data-tid",t.id);btn.innerHTML=t.ic;btn.title=t.lb;
    btn.onclick=function(){tool=t.id;updSb();};sb.appendChild(btn);
  })(TOOLS[i]);}
  var sep=document.createElement("div");sep.className="sep";sb.appendChild(sep);
  for(var j=0;j<COLORS.length;j++){(function(c){
    var btn=document.createElement("button");btn.className="cbtn";btn.setAttribute("data-cid",c);btn.style.background=c;
    btn.onclick=function(){color=c;updSbColor();};sb.appendChild(btn);
  })(COLORS[j]);}
  var sep2=document.createElement("div");sep2.className="sep";sb.appendChild(sep2);
  var lbl=document.createElement("div");lbl.className="slbl";lbl.textContent="Ep.";sb.appendChild(lbl);
  var SWS=[1,2,4,7];
  for(var k=0;k<SWS.length;k++){(function(w){
    var btn=document.createElement("button");btn.className="swbtn";btn.setAttribute("data-sw",w);
    var bar=document.createElement("div");bar.style.cssText="height:"+w+"px;width:28px;border-radius:"+w+"px;background:#666;";
    btn.appendChild(bar);btn.onclick=function(){strokeW=w;updSbStroke();};sb.appendChild(btn);
  })(SWS[k]);}
  updSb();updSbColor();updSbStroke();
}
function updSb(){var b=document.getElementById("sb").querySelectorAll("[data-tid]");for(var i=0;i<b.length;i++)b[i].className="tbtn"+(b[i].getAttribute("data-tid")===tool?" on":"");}
function updSbColor(){var b=document.getElementById("sb").querySelectorAll("[data-cid]");for(var i=0;i<b.length;i++)b[i].className="cbtn"+(b[i].getAttribute("data-cid")===color?" on":"");}
function updSbStroke(){var b=document.getElementById("sb").querySelectorAll("[data-sw]");for(var i=0;i<b.length;i++){var w=parseInt(b[i].getAttribute("data-sw"));b[i].style.background=w===strokeW?"#21262d":"transparent";var bar=b[i].firstChild;if(bar)bar.style.background=w===strokeW?"#e8e0d0":"#666";}}

// Formations
function buildFormations(){
  var fg=document.getElementById("fg");if(fg.children.length>0)return;
  for(var i=0;i<FORMATIONS.length;i++){(function(f){
    var btn=document.createElement("button");btn.className="fbtn";
    btn.innerHTML='<span class="fi">+</span><span class="fn">'+f.name+'</span>';
    btn.onclick=function(){
      var lb=document.getElementById("lblck").checked;var pts=f.fn(numSk);
      var ns=pts.map(function(p,idx){return {id:uid(),type:"cross",x:p.x,y:p.y,col:color,sz:skSz,lbl:lb?String(idx+1):""};});
      setEls(function(els){return els.concat(ns);});
    };
    fg.appendChild(btn);
  })(FORMATIONS[i]);}
}

// Page bar
function buildPgBar(){
  var bar=document.getElementById("pgbar");bar.innerHTML="";
  for(var i=0;i<pages.length;i++){(function(pg,idx){
    var btn=document.createElement("button");btn.className="pgbtn"+(pg.id===curPage?" on":"");btn.textContent=pg.name;
    btn.onclick=function(){
      if(pg.id===curPage||transitioning||animating)return;
      var fi=getPageIdx(curPage);animTrans(curPage,pg.id,idx>fi?-1:1);
    };
    bar.appendChild(btn);
  })(pages[i],i);}
  var add=document.createElement("button");add.id="pgadd";add.textContent="+";add.title="Nouveau schema";
  add.onclick=function(){
    var id="p"+Date.now();
    pages.push({id:id,name:"Schema "+(pages.length+1),els:[],hist:[[]],trans:{}});
    animTrans(curPage,id,-1);
  };
  bar.appendChild(add);
}

// Init
loadInitial();buildSidebar();buildFormations();buildPgBar();resize();

})();
